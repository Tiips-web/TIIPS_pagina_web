<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Psicólogo</title>

<style>
:root {
  --primary: #0f766e;
  --dark: #064e3b;
  --accent: #14b8a6;
  --bg-gradient: linear-gradient(135deg, #ecfdf5, #d1fae5);
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--bg-gradient);
}

.boton-disparador {
  background: var(--dark);
  color: white;
  padding: 18px 36px;
  border: none;
  border-radius: 50px;
  cursor: pointer;
}

/* MODAL */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
}

.modal {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 90%;
  max-width: 500px;
  max-height: 85vh;
  background: white;
  border-radius: 24px;
  overflow: hidden;
}

/* HEADER */
.modal-header {
  background: linear-gradient(135deg, #064e3b, #10b981);
  height: 120px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}

.user-avatar {
  width: 70px;
  height: 70px;
  background: white;
  border-radius: 50%;
  margin-bottom: -35px;
}

/* CONTENT */
.modal-content {
  padding: 45px 30px 30px;
  overflow-y: auto;
  max-height: calc(85vh - 120px);
}

.grid-inputs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.full-width { grid-column: span 2; }

input, select, textarea {
  width: 100%;
  padding: 10px 5px;
  border: none;
  border-bottom: 2px solid #d1fae5;
  outline: none;
  background: transparent;
}

textarea {
  resize: none;
  height: 60px;
}

input:focus, select:focus, textarea:focus {
  border-bottom-color: var(--accent);
}

/* BOTONES */
.btn-enviar {
  width: 100%;
  background: var(--accent);
  color: white;
  padding: 14px;
  border: none;
  border-radius: 50px;
  margin-top: 20px;
  cursor: pointer;
}

.btn-cerrar {
  width: 100%;
  background: transparent;
  border: none;
  margin-top: 10px;
  cursor: pointer;
}

/* NUEVO SELECTOR DE DÍAS */
.dias-container {
  display: flex;
  gap: 8px;
}

.dia-btn {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-radius: 10px;
  cursor: pointer;
  background: #d1fae5;
  font-size: 12px;
  transition: .2s;
}

.dia-btn:hover {
  background: #a7f3d0;
}

.dia-btn.activo {
  background: var(--accent);
  color: white;
  font-weight: bold;
}

/* TIPOGRAFÍA MÁS BONITA */
select {
  font-family: 'Inter', 'Segoe UI', sans-serif;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.3px;
  color: #064e3b;

  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;

  padding: 12px 40px 12px 10px;
  border: none;
  border-bottom: 2px solid #a7f3d0;
  background: transparent;

  transition: all 0.25s ease;
  cursor: pointer;
}

/* HOVER */
select:hover {
  border-bottom-color: #10b981;
}

/* FOCUS */
select:focus {
  outline: none;
  border-bottom-color: #14b8a6;
}

/* FLECHA */
.select-wrapper {
  position: relative;
}

.select-wrapper::after {
  content: "▾";
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: #10b981;
  font-size: 14px;
  pointer-events: none;
}

/* OPCIONES (limitado) */
select option {
  font-family: 'Inter', sans-serif;
}
</style>
</head>

<body>

<button class="boton-disparador" onclick="abrir()">Agendar cita</button>

<div class="overlay" id="overlay" onclick="cerrar()"></div>

<div class="modal" id="modal">
  <div class="modal-header">
    <div class="user-avatar"></div>
  </div>

  <div class="modal-content">
    <h2 style="text-align:center;">Consulta Psicológica</h2>

    <div class="grid-inputs">

      <input id="nombre" placeholder="Nombre completo">
      <input id="edad" placeholder="Edad">

      <input id="telefono" placeholder="Teléfono" class="full-width">

      <select id="genero">
        <option value="">Género</option>
        <option>Masculino</option>
        <option>Femenino</option>
        <option>Prefiero no decirlo</option>
      </select>

      <select id="tipo">
        <option value="">Tipo de consulta</option>
        <option>Primera vez</option>
        <option>Seguimiento</option>
      </select>

      <textarea id="motivo" placeholder="¿Qué te gustaría tratar?" class="full-width"></textarea>

      <select id="estado">
        <option value="">¿Cómo te has sentido últimamente?</option>
        <option>Ansiedad</option>
        <option>Estrés</option>
        <option>Tristeza</option>
        <option>Problemas de pareja</option>
        <option>Otro</option>
      </select>

      <select id="frecuencia">
        <option value="">¿Desde cuándo te sientes así?</option>
        <option>Hace días</option>
        <option>Hace semanas</option>
        <option>Hace meses</option>
        <option>Hace años</option>
      </select>

      <!-- NUEVO SELECTOR DE DÍAS -->
      <div class="full-width">
        <p style="margin:0 0 5px; font-size:13px;">Día disponible</p>
        <div class="dias-container" id="dias"></div>
      </div>

      <select id="horario">
        <option value="">Horario</option>
        <option>Mañana</option>
        <option>Tarde</option>
        <option>Noche</option>
      </select>

      <select id="modalidad" class="full-width">
        <option value="">Modalidad</option>
        <option>Presencial</option>
        <option>En línea</option>
      </select>

    </div>

    <button class="btn-enviar" onclick="enviar()">Agendar por WhatsApp</button>
    <button class="btn-cerrar" onclick="cerrar()">Cancelar</button>
  </div>
</div>

<script>
let diaSeleccionado = "";

/* MODAL */
function abrir(){
  modal.style.display="block";
  overlay.style.display="block";
}
function cerrar(){
  modal.style.display="none";
  overlay.style.display="none";
}

/* GENERAR LUNES A VIERNES */
const contenedorDias = document.getElementById("dias");
const hoy = new Date();

let diasAgregados = 0;
let i = 0;

while(diasAgregados < 5){
  let fecha = new Date();
  fecha.setDate(hoy.getDate() + i);

  let diaSemana = fecha.getDay();

  if(diaSemana !== 0 && diaSemana !== 6){
    let nombreDia = fecha.toLocaleDateString('es-MX', { weekday: 'short' });
    let numero = fecha.getDate();

    let div = document.createElement("div");
    div.className = "dia-btn";
    div.innerHTML = `${nombreDia}<br><small>${numero}</small>`;

    div.onclick = () => {
      document.querySelectorAll(".dia-btn").forEach(d => d.classList.remove("activo"));
      div.classList.add("activo");

      diaSeleccionado = fecha.toLocaleDateString('es-MX', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    };

    contenedorDias.appendChild(div);
    diasAgregados++;
  }

  i++;
}

/* ENVIAR */
function enviar(){
  let m = `Hola, quiero agendar una cita psicológica:%0A
Nombre: ${nombre.value}%0A
Edad: ${edad.value}%0A
Teléfono: ${telefono.value}%0A
Motivo: ${motivo.value}%0A
Estado: ${estado.value}%0A
Desde cuándo: ${frecuencia.value}%0A
Día: ${diaSeleccionado}%0A
Horario: ${horario.value}%0A
Modalidad: ${modalidad.value}`;

  window.open(`https://wa.me/3325004258?text=${m}`);
}
</script>

</body>
</html>
